
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8 - Tính chỉ số BMI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #4f46e5;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3730a3;
        }

        #ketQua {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef2ff;
            border-radius: 6px;
            line-height: 1.8;
        }

        .an {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Tính chỉ số BMI</h1>

        <label for="canNang">Cân nặng (kg):</label>
        <input
            type="number"
            id="canNang"
            placeholder="Ví dụ: 50"
            min="0.1"
            step="any"
        >

        <label for="chieuCao">Chiều cao (m):</label>
        <input
            type="number"
            id="chieuCao"
            placeholder="Ví dụ: 1.65"
            min="0.1"
            step="any"
        >

        <button onclick="tinhBMI()">Tính BMI</button>

        <div id="ketQua" class="an" aria-live="polite"></div>
    </div>

    <script>
        function tinhBMI() {
        
            let canNang = parseFloat(
                document.getElementById("canNang").value
            );

            let chieuCao = parseFloat(
                document.getElementById("chieuCao").value
            );

            let ketQua = document.getElementById("ketQua");

            
            if (
                !Number.isFinite(canNang) ||
                !Number.isFinite(chieuCao) ||
                canNang <= 0 ||
                chieuCao <= 0
            ) {
                ketQua.classList.remove("an");
                ketQua.textContent =
                    "Vui lòng nhập cân nặng và chiều cao hợp lệ.";
                return;
            }

            
            let bmi = canNang / (chieuCao * chieuCao);

            let phanLoai;

            if (bmi < 18.5) {
                phanLoai = "Thiếu cân";
            } else if (bmi < 25) {
                phanLoai = "Bình thường";
            } else {
                phanLoai = "Thừa cân";
            }

            
            ketQua.classList.remove("an");
            ketQua.innerHTML =
                "Chỉ số BMI: <strong>" + bmi.toFixed(2) +
                "</strong><br>" +
                "Phân loại: <strong>" + phanLoai + "</strong>";
        }
    </script>
</body>
</html>
