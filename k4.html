
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K4 - Phân trang danh sách</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #danhSach {
            margin-top: 20px;
        }

        .muc {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .muc:nth-child(even) {
            background-color: #f9fafb;
        }

        #phanTrang {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        button {
            padding: 10px 15px;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e0e7ff;
        }

        button.active {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        #thongTin {
            color: #666;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Phân trang danh sách</h1>

        <div id="danhSach"></div>

        <div id="thongTin"></div>

        <div id="phanTrang"></div>
    </div>

    <script>
        
        let danhSach = [];

        for (let i = 1; i <= 50; i++) {
            danhSach.push("Mục " + i);
        }

        
        let soMucMoiTrang = 10;
        let trangHienTai = 1;

        
        function hienThiDanhSach(trang) {
            trangHienTai = trang;

           
            let batDau = (trang - 1) * soMucMoiTrang;
            let ketThuc = batDau + soMucMoiTrang;

           
            let danhSachTrang = danhSach.slice(batDau, ketThuc);

            
            let noiDung = "";

            for (let i = 0; i < danhSachTrang.length; i++) {
                noiDung +=
                    '<div class="muc">' +
                    danhSachTrang[i] +
                    '</div>';
            }

            document.getElementById("danhSach").innerHTML = noiDung;

            
            document.getElementById("thongTin").textContent =
                "Trang " + trang + " / " +
                Math.ceil(danhSach.length / soMucMoiTrang);

            
            hienThiNutPhanTrang();
        }

       
        function hienThiNutPhanTrang() {
            let tongSoTrang = Math.ceil(
                danhSach.length / soMucMoiTrang
            );

            let noiDung = "";

            for (let i = 1; i <= tongSoTrang; i++) {
                noiDung +=
                    '<button class="' +
                    (i === trangHienTai ? 'active' : '') +
                    '" onclick="hienThiDanhSach(' + i + ')">' +
                    i +
                    '</button>';
            }

            document.getElementById("phanTrang").innerHTML = noiDung;
        }

        
        hienThiDanhSach(1);
    </script>
</body>
</html>
